# =============================================================================
# Compliance Operator — ROSA HCP variant
#
# Identical to the base OperatorPolicy except:
#   - nodeSelector schedules operator pods on worker nodes (ROSA HCP has
#     no accessible master/control-plane nodes).
#   - The Compliance Operator auto-detects the HyperShift platform via
#     controlPlaneTopology: External and loads only Node profiles.
#
# Ref: https://docs.okd.io/4.22/security/compliance_operator/co-management/compliance-operator-installation.html#installing-compliance-operator-rosa_compliance-operator-installation
# =============================================================================
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: OperatorPolicy
metadata:
  name: compliance-operator-install
spec:
  complianceType: musthave
  complianceConfig:
    catalogSourceUnhealthy: NonCompliant
    deploymentsUnavailable: NonCompliant
    deprecationsPresent: Compliant
    upgradesAvailable: Compliant
  remediationAction: enforce
  removalBehavior:
    clusterServiceVersions: Delete
    customResourceDefinitions: Delete
    operatorGroups: DeleteIfUnused
    subscriptions: Delete
  severity: critical
  upgradeApproval: Automatic
  versions:
    - compliance-operator.v0.1.61
    - compliance-operator.v1.7.0
    - compliance-operator.v1.9.1
    - compliance-operator.v1.10.0
  subscription:
    channel: stable
    name: compliance-operator
    namespace: openshift-compliance
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    config:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
  operatorGroup:
    name: compliance-operator
    targetNamespaces:
      - openshift-compliance
