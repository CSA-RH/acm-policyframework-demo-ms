# =============================================================================
# CIS ScanSetting (reference only — not deployed by current policies)
#
# NOTE: Scan scheduling is managed from the ACS UI (Option B).
# This file is kept for reference if you switch to ACM-managed scans.
#
# For ROSA HCP clusters, change roles to [worker] only — ROSA HCP has
# no master nodes accessible to the customer.
# =============================================================================
---
apiVersion: compliance.openshift.io/v1alpha1
autoApplyRemediations: false
autoUpdateRemediations: false
kind: ScanSetting
maxRetryOnTimeout: 3
metadata:
  name: ocp4-cis
  namespace: openshift-compliance
rawResultStorage:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  pvAccessModes:
  - ReadWriteOnce
  rotation: 3
  size: 1Gi
  tolerations:
  - operator: Exists
    key: node-role.kubernetes.io/infra
roles:
  # Self-managed: [master, worker]
  # ROSA HCP:     [worker]  (no master nodes)
  - master
  - worker
scanTolerations:
- operator: Exists
schedule: 0 2 * * *
showNotApplicable: false
strictNodeScan: true
timeout: 30m
