# =============================================================================
# Placements for Compliance Operator policies
#
# Cluster detection (automatic, no manual labels needed):
#   Self-managed OCP:  product=OpenShift, controlplanetopology != External
#   ROSA HCP:          product=ROSA, controlplanetopology=External
#
# These use claimSelector on auto-populated ManagedCluster clusterClaims:
#   - product.open-cluster-management.io:          "OpenShift" or "ROSA"
#   - controlplanetopology.openshift.io:           "External" (HCP) or other
# =============================================================================

# --- All OpenShift clusters (bootstrap Job) ---
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-compliance-all
  namespace: acm-policies
spec:
  tolerations:
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            vendor: OpenShift
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-compliance-all
  namespace: acm-policies
placementRef:
  name: placement-compliance-all
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: compliance-all-clusters
    kind: PolicySet
    apiGroup: policy.open-cluster-management.io

# --- Self-managed OCP clusters (controlplanetopology != External) ---
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-compliance-self-managed
  namespace: acm-policies
spec:
  tolerations:
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            vendor: OpenShift
        claimSelector:
          matchExpressions:
            - key: controlplanetopology.openshift.io
              operator: NotIn
              values: ["External"]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-compliance-self-managed
  namespace: acm-policies
placementRef:
  name: placement-compliance-self-managed
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: compliance-self-managed
    kind: PolicySet
    apiGroup: policy.open-cluster-management.io

# --- ROSA HCP clusters (controlplanetopology=External, product=ROSA) ---
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-compliance-rosa-hcp
  namespace: acm-policies
spec:
  tolerations:
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            vendor: OpenShift
        claimSelector:
          matchExpressions:
            - key: product.open-cluster-management.io
              operator: In
              values: ["ROSA"]
            - key: controlplanetopology.openshift.io
              operator: In
              values: ["External"]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-compliance-rosa-hcp
  namespace: acm-policies
placementRef:
  name: placement-compliance-rosa-hcp
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: compliance-rosa-hcp
    kind: PolicySet
    apiGroup: policy.open-cluster-management.io
