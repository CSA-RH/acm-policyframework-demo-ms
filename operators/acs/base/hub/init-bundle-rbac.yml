---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: create-init-bundle
  namespace: stackrox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-init-bundle
  namespace: stackrox
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-init-bundle
  namespace: stackrox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: create-init-bundle
subjects:
  - kind: ServiceAccount
    name: create-init-bundle
    namespace: stackrox
