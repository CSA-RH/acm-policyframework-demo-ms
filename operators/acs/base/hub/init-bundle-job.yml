---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-cluster-init-bundle
  namespace: stackrox
  labels:
    init-bundle: central
spec:
  template:
    metadata:
      labels:
        init-bundle: central
    spec:
      serviceAccountName: create-init-bundle
      restartPolicy: Never
      containers:
        - name: create-init-bundle
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              #!/usr/bin/env bash
              set -eo pipefail

              CENTRAL="https://central.stackrox.svc:443"
              BUNDLE="acm-init-bundle"

              if kubectl get secret/sensor-tls &>/dev/null; then
                echo "[=] Init bundle secrets already exist — skipping"
                exit 0
              fi

              echo "[-] Waiting for Central to be ready..."
              attempt=0
              until curl -sSk -o /dev/null \
                    -u "admin:${PASSWORD}" "${CENTRAL}/v1/ping"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 30 ]; then
                  echo "[!] Central not ready after 30 attempts — aborting"
                  exit 1
                fi
                echo "    attempt ${attempt}/30 — retrying in 20 s..."
                sleep 20
              done
              echo "[+] Central is ready"

              echo "[-] Creating init bundle '${BUNDLE}'..."
              attempt=0
              until curl -sSk -o /tmp/bundle.json \
                    -u "admin:${PASSWORD}" \
                    -X POST -H "Content-Type: application/json" \
                    -d "{\"name\":\"${BUNDLE}\"}" \
                    --fail "${CENTRAL}/v1/cluster-init/init-bundles"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 5 ]; then
                  echo "[!] Max attempts to create bundle reached"
                  exit 1
                fi

                echo "[-] Checking for existing bundle to revoke..."
                curl -sSk -o /tmp/find_bundle.json \
                  -u "admin:${PASSWORD}" \
                  -H "Content-Type: application/json" \
                  "${CENTRAL}/v1/cluster-init/init-bundles"

                bundle_id=$(python3 -c "
              import json, sys
              items = json.load(open('/tmp/find_bundle.json')).get('items', [])
              matches = [x for x in items if x['name'] == '${BUNDLE}']
              print(matches[0]['id'] if matches else '')
              " 2>/dev/null)

                if [ -n "${bundle_id}" ]; then
                  echo "[-] Revoking existing bundle ${bundle_id}..."
                  curl -sSk -u "admin:${PASSWORD}" \
                    -X PATCH -H "Content-Type: application/json" \
                    -d "{\"ids\":[\"${bundle_id}\"],\"confirmImpactedClustersIds\":[]}" \
                    "${CENTRAL}/v1/cluster-init/init-bundles/revoke"
                fi

                echo "    attempt ${attempt}/5 — retrying in 5 s..."
                sleep 5
              done

              echo "[+] Bundle received"

              echo "[-] Applying bundle..."
              python3 -c "
              import json, sys, base64
              bundle = json.load(open('/tmp/bundle.json')).get('kubectlBundle', '')
              if not bundle:
                  print('ERROR: no kubectlBundle in response', file=sys.stderr)
                  sys.exit(1)
              sys.stdout.write(base64.b64decode(bundle).decode())
              " > /tmp/bundle.yaml

              oc apply -n stackrox -f /tmp/bundle.yaml

              ACS_HOST="$(oc get route central -n stackrox -o custom-columns=HOST:.spec.host --no-headers):443"
              echo "[-] Patching sensor-tls with acs-host=${ACS_HOST}..."
              oc patch secret sensor-tls -n stackrox --type='json' \
                -p="[{\"op\":\"add\",\"path\":\"/data/acs-host\",\"value\":\"$(echo -n ${ACS_HOST} | base64 -w 0)\"}]"

              oc label secret sensor-tls     -n stackrox certificate_key_name=sensor-cert.pem
              oc label secret collector-tls  -n stackrox certificate_key_name=collector-cert.pem
              oc label secret admission-control-tls -n stackrox certificate_key_name=admission-control-cert.pem

              echo "[+] Init bundle secrets applied, labelled, and patched"
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-htpasswd
                  key: password
      terminationGracePeriodSeconds: 30
  backoffLimit: 10
