---
apiVersion: v1
kind: Secret
metadata:
  name: acs-collector-tls
  namespace: acm-policies
type: Opaque
data:
  ca.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "collector-tls").data "ca.pem") }}'
  collector-cert.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "collector-tls").data "collector-cert.pem") }}'
  collector-key.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "collector-tls").data "collector-key.pem") }}'
---
apiVersion: v1
kind: Secret
metadata:
  name: acs-sensor-tls
  namespace: acm-policies
type: Opaque
data:
  ca.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "sensor-tls").data "ca.pem") }}'
  sensor-cert.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "sensor-tls").data "sensor-cert.pem") }}'
  sensor-key.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "sensor-tls").data "sensor-key.pem") }}'
---
apiVersion: v1
kind: Secret
metadata:
  name: acs-admission-control-tls
  namespace: acm-policies
type: Opaque
data:
  ca.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "admission-control-tls").data "ca.pem") }}'
  admission-control-cert.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "admission-control-tls").data "admission-control-cert.pem") }}'
  admission-control-key.pem: '{{ (index (lookup "v1" "Secret" "stackrox" "admission-control-tls").data "admission-control-key.pem") }}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acs-central-info
  namespace: acm-policies
data:
  host: '{{ (lookup "route.openshift.io/v1" "Route" "stackrox" "central").spec.host }}'
