---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gen-policy-acs
placementBindingDefaults:
  name: binding-acs
policyDefaults:
  namespace: acm-policies
  remediationAction: enforce
  consolidateManifests: false
  evaluationInterval:
    compliant: 30s
    noncompliant: 10s
  severity: high
  categories:
    - "CM Configuration Management"
  controls:
    - "CM-2 Baseline Configuration"
  standards:
    - "NIST SP 800-53"

policies:
  # ------------------------------------------------------------------ #
  #  1. Install RHACS operator on hub and managed clusters              #
  # ------------------------------------------------------------------ #
  - name: acs-operator
    description: "Installs the RHACS operator and creates namespaces on all ACS clusters"
    placement:
      placementName: acs-all-placement
    manifests:
      - path: operator-namespace.yml
        name: acs-operator-namespace

      - path: stackrox-namespace.yml
        name: stackrox-namespace

      - path: operatorpolicy.yml
        name: rhacs-operator-install

  # ------------------------------------------------------------------ #
  #  2. Deploy Central, ConsoleLink, and health check on the hub        #
  #     Depends on: acs-operator                                        #
  # ------------------------------------------------------------------ #
  - name: acs-central
    description: "Deploys Central on the hub with health monitoring and ConsoleLink"
    placement:
      placementName: acs-hub-placement
    dependencies:
      - name: acs-operator
        compliance: "Compliant"
    manifests:
      - path: hub/central.yml
        name: stackrox-central-services

      - path: hub/consolelink.yml
        name: acs-consolelink

      - path: hub/central-status.yml
        name: acs-central-status
        remediationAction: InformOnly
        severity: high
        extraDependencies:
          - name: stackrox-central-services
            kind: ConfigurationPolicy
            compliance: "Compliant"

  # ------------------------------------------------------------------ #
  #  3. Create init bundle for SecuredCluster authentication             #
  #     Depends on: acs-central                                          #
  # ------------------------------------------------------------------ #
  - name: acs-central-init-bundle
    description: "Runs a Job to generate an init bundle and store TLS secrets"
    placement:
      placementName: acs-hub-placement
    dependencies:
      - name: acs-central
        compliance: "Compliant"
    manifests:
      - path: hub/init-bundle-rbac.yml
        name: create-cluster-init-serviceaccount

      - path: hub/init-bundle-job.yml
        name: create-cluster-init-job
        extraDependencies:
          - name: create-cluster-init-serviceaccount
            kind: ConfigurationPolicy
            compliance: "Compliant"

  # ------------------------------------------------------------------ #
  #  4. Monitor init bundle cert expiry + deploy hub SecuredCluster      #
  #     Depends on: acs-central-init-bundle                              #
  #     The CertificatePolicy watches sensor-tls for 720h min duration.  #
  #     The hub SecuredCluster is gated on the cert being valid.         #
  # ------------------------------------------------------------------ #
  - name: acs-central-init-bundle-cert
    description: "Monitors init bundle certificate expiry and deploys hub SecuredCluster"
    placement:
      placementName: acs-hub-placement
    dependencies:
      - name: acs-central-init-bundle
        compliance: "Compliant"
    manifests:
      - path: hub/sensor-tls-cert-policy.yml
        name: acs-bundle-certificates

      - path: hub/expired-sensor-tls.yml
        remediationAction: InformOnly
        name: acs-cert-sensor-tls

      - path: managed/securedcluster.yml
        name: stackrox-secured-cluster-services
        extraDependencies:
          - name: acs-cert-sensor-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"

  # ------------------------------------------------------------------ #
  #  5. Auto-rotate expired init bundle certificates                     #
  #     Depends on: acs-central-init-bundle-cert being NonCompliant      #
  #     (i.e. the cert has expired or is about to expire).               #
  #     Deletes the three expired TLS secrets and resets the Job so      #
  #     a new bundle is automatically regenerated.                       #
  # ------------------------------------------------------------------ #
  - name: acs-central-expired-certs
    description: "Deletes expired init bundle secrets and resets the Job for regeneration"
    complianceType: mustnothave
    placement:
      placementName: acs-hub-placement
    dependencies:
      - name: acs-central-init-bundle-cert
        compliance: "NonCompliant"
    ignorePending: true
    manifests:
      - path: hub/expired-admission-control-tls.yml
        name: expired-admission-control-tls

      - path: hub/expired-collector-tls.yml
        name: expired-collector-tls

      - path: hub/expired-sensor-tls.yml
        name: expired-sensor-tls

      - path: hub/init-bundle-job.yml
        name: expired-init-bundle-job
        extraDependencies:
          - name: expired-admission-control-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"
          - name: expired-collector-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"
          - name: expired-sensor-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"

  # ------------------------------------------------------------------ #
  #  6. Sync init bundle secrets to the policy namespace                 #
  #     Depends on: acs-central-init-bundle-cert                         #
  #     Uses object-templates-raw with copySecretData to copy the        #
  #     three TLS secrets from stackrox to the policy namespace so       #
  #     hub templates in the acs-sensor policy can access them.          #
  # ------------------------------------------------------------------ #
  - name: acs-sensor-sync-certs
    description: "Syncs ACS init bundle secrets from stackrox to policy namespace"
    placement:
      placementName: acs-hub-placement
    dependencies:
      - name: acs-central-init-bundle-cert
        compliance: "Compliant"
    manifests:
      - path: hub/sensor-sync-tls-certs.yml
        name: sensor-sync-tls-certs

  # ------------------------------------------------------------------ #
  #  7. Propagate TLS secrets and deploy SecuredCluster on managed       #
  #     Depends on: acs-sensor-sync-certs                                #
  #     Each secret is gated as an extraDependency for the               #
  #     SecuredCluster to ensure all three exist before deploying.       #
  # ------------------------------------------------------------------ #
  - name: acs-sensor
    description: "Propagates init bundle secrets and deploys SecuredCluster on managed clusters"
    placement:
      placementName: acs-managed-placement
    dependencies:
      - name: acs-sensor-sync-certs
        compliance: "Compliant"
    manifests:
      - path: stackrox-namespace.yml
        name: acs-sensor-stackrox-ns

      - path: managed/propagate-admission-control-tls.yml
        name: propagate-admission-control-tls

      - path: managed/propagate-collector-tls.yml
        name: propagate-collector-tls

      - path: managed/propagate-sensor-tls.yml
        name: propagate-sensor-tls

      - path: managed/securedcluster.yml
        name: managed-securedcluster
        extraDependencies:
          - name: propagate-admission-control-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"
          - name: propagate-collector-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"
          - name: propagate-sensor-tls
            kind: ConfigurationPolicy
            compliance: "Compliant"
