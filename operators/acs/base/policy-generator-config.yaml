---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gen-policy-acs
placementBindingDefaults:
  name: binding-acs
policyDefaults:
  namespace: acm-policies
  remediationAction: enforce
  consolidateManifests: false
  severity: high
  categories:
    - "CM Configuration Management"
  controls:
    - "CM-2 Baseline Configuration"
  standards:
    - "NIST SP 800-53"

policies:
  # ------------------------------------------------------------------ #
  #  1. Hub – install RHACS operator and deploy Central                 #
  # ------------------------------------------------------------------ #
  - name: acs-hub-central
    description: "Installs the RHACS operator and deploys Central on the hub cluster"
    placement:
      placementName: acs-hub-placement
    manifests:
      - path: operator-namespace.yml
        name: acs-hub-operator-ns

      - path: operatorpolicy.yml
        name: acs-hub-operator-install

      - path: stackrox-namespace.yml
        name: acs-hub-stackrox-ns

      - path: hub/central.yml
        name: acs-hub-central

  # ------------------------------------------------------------------ #
  #  2. Hub – create init bundle for SecuredCluster authentication      #
  #     Depends on: acs-hub-central (Central must be running)           #
  # ------------------------------------------------------------------ #
  - name: acs-hub-init-bundle
    description: "Creates an init bundle on Central and stores the TLS secrets on the hub"
    placement:
      placementName: acs-hub-placement
    extraDependencies:
      - name: acs-hub-central
        compliance: Compliant
    manifests:
      - path: hub/init-bundle-rbac.yml
        name: acs-hub-init-bundle-rbac

      - path: hub/init-bundle-job.yml
        name: acs-hub-init-bundle-job

  # ------------------------------------------------------------------ #
  #  3. Hub – copy init bundle secrets to the policy namespace          #
  #     The hub template lookup restricts access to the policy's own    #
  #     namespace. This step copies the TLS secrets from stackrox to    #
  #     acm-policies using managed-cluster templates (no restriction).  #
  #     Also stores the Central route host for SecuredCluster config.   #
  #     Depends on: acs-hub-init-bundle (secrets must exist on hub)     #
  # ------------------------------------------------------------------ #
  - name: acs-hub-copy-secrets
    description: "Copies ACS init bundle secrets from stackrox to the policy namespace"
    placement:
      placementName: acs-hub-placement
    extraDependencies:
      - name: acs-hub-init-bundle
        compliance: Compliant
    manifests:
      - path: hub/copy-secrets-to-policy-ns.yml
        name: acs-hub-copy-secrets

  # ------------------------------------------------------------------ #
  #  4. Managed – deploy SecuredCluster on managed clusters             #
  #     The RHACS operator is installed on the hub by acs-hub-central.  #
  #     On non-hub managed clusters the operator must be installed      #
  #     separately (or add a dedicated operator policy for them).       #
  #     Depends on: acs-hub-copy-secrets (Central info + TLS secrets)   #
  # ------------------------------------------------------------------ #
  - name: acs-managed-securedcluster
    description: "Deploys SecuredCluster on managed clusters (RHACS operator assumed installed)"
    placement:
      placementName: acs-managed-placement
    extraDependencies:
      - name: acs-hub-copy-secrets
        compliance: Compliant
    manifests:
      - path: stackrox-namespace.yml
        name: acs-managed-stackrox-ns

      - path: managed/securedcluster.yml
        name: acs-managed-securedcluster

  # ------------------------------------------------------------------ #
  #  5. Managed – distribute init bundle TLS secrets to managed clusters #
  #     Depends on: acs-hub-copy-secrets (secrets in acm-policies ns)   #
  # ------------------------------------------------------------------ #
  - name: acs-managed-init-bundle
    description: "Distributes the init bundle TLS secrets from the hub to managed clusters"
    placement:
      placementName: acs-managed-placement
    extraDependencies:
      - name: acs-hub-copy-secrets
        compliance: Compliant
    manifests:
      - path: managed/init-bundle-secrets.yml
        name: acs-managed-init-bundle-secrets
